[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-discipline-assistant"
version = "0.1.0"
description = "A股个人交易研究与纪律系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pymysql>=1.1,<2",
  "akshare>=1.17,<2",
  "twscrape>=0.17,<1",
  "backtesting>=0.6,<1",
  "apscheduler>=3.10,<4",
  "pandas>=2.2,<3",
  "pandas-ta-classic>=0.3,<1",
  "vectorbt>=0.28,<1",
  "httpx>=0.27,<1",
  "pypdf>=6,<7",
  "exchange-calendars>=4.5,<5",
  "baostock==0.9.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.15.22,<0.16",
  "mypy>=1.11,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "mysql_integration: requires MYSQL_TEST_DATABASE_URL and an isolated MySQL 8 database",
  "freestockdb_integration: requires a real local free-stockdb HTTP service",
  "baostock_integration: requires the real BaoStock remote service",
  "market_breadth_integration: requires local FreeStockDB and real AKShare network",
]

[tool.ruff]
line-length = 100
target-version = "py311"
