services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      DATABASE_URL: mysql+pymysql://stock_user:${MYSQL_PASSWORD:-change_me}@mysql:3306/stock_assistant?charset=utf8mb4
      SCHEDULER_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stock_assistant
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change_root_me}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
