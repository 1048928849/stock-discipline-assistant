name: ci

on:
  pull_request:
  push:
    branches:
      - agent/stock-discipline-os-core
      - agent/stock-product-v1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: git diff --check
      - run: python -m alembic heads | grep -Fx "20260725_0011 (head)"
      - run: python -c "from app.main import app; assert app.openapi()['paths']; print(app.title)"

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Upgrade an empty SQLite database
        env:
          DATABASE_URL: sqlite:////tmp/stock-discipline-ci.db
        run: python -m alembic upgrade head
      - run: python -m pytest -m "not mysql_integration"

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/stock_discipline_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Create isolated utf8mb4 database
        run: >-
          python -c "import os; from sqlalchemy import create_engine, make_url;
          url=make_url(os.environ['MYSQL_TEST_DATABASE_URL']);
          engine=create_engine(url.set(database='mysql'), isolation_level='AUTOCOMMIT');
          connection=engine.connect();
          connection.exec_driver_sql('CREATE DATABASE stock_discipline_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          connection.close(); engine.dispose()"
      - run: python -m pytest -m mysql_integration

  required:
    if: always()
    needs:
      - quality
      - sqlite
      - mysql8
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SQLITE_RESULT: ${{ needs.sqlite.result }}
          MYSQL_RESULT: ${{ needs.mysql8.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$MYSQL_RESULT" = success
