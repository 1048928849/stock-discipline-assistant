name: ci

on:
  pull_request:
  push:
    branches:
      - agent/stock-discipline-os-core
      - agent/stock-product-v1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: node --check app/static/product-v1.js
      - run: node --check app/static/selected-stock.js
      - run: git diff --check
      - name: Require exactly one Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          heads = ScriptDirectory.from_config(
              Config("alembic.ini")
          ).get_heads()

          if len(heads) != 1:
              raise SystemExit(
                  f"expected exactly one Alembic head, got {heads}"
              )

          print(f"{heads[0]} (head)")
          PY
      - run: python -c "from app.main import app; assert app.openapi()['paths']; print(app.title)"

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Upgrade an empty SQLite database
        env:
          DATABASE_URL: sqlite:////tmp/stock-discipline-ci.db
        run: python -m alembic upgrade head
      - run: python -m pytest -m "not mysql_integration"

  mysql8:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/stock_discipline_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Create isolated utf8mb4 database
        run: >-
          python -c "import os; from sqlalchemy import create_engine, make_url;
          url=make_url(os.environ['MYSQL_TEST_DATABASE_URL']);
          engine=create_engine(url.set(database='mysql'), isolation_level='AUTOCOMMIT');
          connection=engine.connect();
          connection.exec_driver_sql('CREATE DATABASE stock_discipline_test_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          connection.close(); engine.dispose()"
      - run: python -m pytest -m mysql_integration

  browser-smoke:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:////tmp/stock-discipline-browser-smoke.db
      SCHEDULER_ENABLED: "false"
      BROWSER_SMOKE_BASE_URL: http://127.0.0.1:8765
      BROWSER_SMOKE_ARTIFACTS: browser-smoke-artifacts
      RUN_BROWSER_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Upgrade temporary SQLite database
        run: python -m alembic upgrade head
      - name: Run deterministic desktop and mobile smoke
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > /tmp/browser-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/selected-stock-analysis") as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("local app did not become ready")
          PY
          python -m pytest tests/browser/test_selected_stock_smoke.py --browser chromium
      - name: Upload browser smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            browser-smoke-artifacts
            /tmp/browser-smoke-server.log

  required:
    if: always()
    needs:
      - quality
      - sqlite
      - mysql8
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SQLITE_RESULT: ${{ needs.sqlite.result }}
          MYSQL_RESULT: ${{ needs.mysql8.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser-smoke.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$SQLITE_RESULT" = success
          test "$MYSQL_RESULT" = success
          test "$BROWSER_SMOKE_RESULT" = success
